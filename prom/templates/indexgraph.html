<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Price Graph</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Stock Price Graph</h1>
        <form method="POST">
            <label for="stock_name">Enter Stock Ticker:</label>
            <input type="text" id="stock_name" name="stock_name" placeholder="e.g., AAPL, GOOGL" required>
            <button type="submit">Generate Graph</button>
        </form>

       
        <div class="graph">
            <h3>Graph for the Stock:</h3>
            <img src="" alt="Stock Price Graph">
        </div>
       
</body>
</html>
